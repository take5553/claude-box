# ---------------------------------------------------------------------------
# Hostname-based egress filter (design 02).
#
# iptables transparently redirects 80/443 to this proxy, and the allow/deny
# decision is made here against the "hostname". The IP is never used as a
# decision input:
#   - 443: peek at the SNI in the TLS ClientHello (ssl_preread), match it
#     against the allowlist, and if allowed, *re-resolve that hostname on the
#     nginx side* before relaying. TLS stays end-to-end and is not decrypted
#     (no MITM = no cert distribution and no verification bypass).
#   - 80 : match the Host header against the allowlist.
#
# The "destination IP the client specified" is not used to pick the upstream.
# Spoofing by putting an allowed hostname in the SNI while connecting to a
# different IP does not work.
#
# The allowlists (the include targets of the two maps below) are generated by
# init-firewall.sh at startup from DOMAINS. Both the TLS and HTTP allowlists
# come from a single source list, so the set of destinations is managed in one
# place.
# ---------------------------------------------------------------------------

load_module /usr/lib/nginx/modules/ngx_stream_module.so;

worker_processes 1;
pid /run/egress-proxy/nginx.pid;

events {
    worker_connections 1024;
}

# --- 443/TCP: decide by SNI and relay ---------------------------------------
stream {
    include /run/egress-proxy/resolver.conf;

    # Allowed hostname -> "that-hostname:443". Anything not allowed becomes "",
    # so proxy_pass cannot determine an upstream and drops the connection
    # (fail-closed).
    map $ssl_preread_server_name $egress_upstream {
        default "";
        include /run/egress-proxy/allow-tls.map;
    }

    log_format egress_tls '$time_local sni="$ssl_preread_server_name" '
                          'upstream="$egress_upstream" status=$status sent=$bytes_sent';
    access_log /var/log/egress-proxy/tls.log egress_tls;

    server {
        listen 127.0.0.1:3128;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_timeout 10m;          # so large binary fetches (Go modules, etc.) don't get cut off
        proxy_pass $egress_upstream;
    }
}

# --- 80/TCP: decide by Host header and relay ---------------------------------
# Debian/Ubuntu mirrors serve plain HTTP, so apt won't work over 443 alone.
http {
    include /run/egress-proxy/resolver.conf;

    # egressd cannot write under /var/lib/nginx, which nginx uses by default,
    # so point the temp-file locations at a dedicated directory.
    client_body_temp_path /var/lib/egress-proxy/client_body;
    proxy_temp_path       /var/lib/egress-proxy/proxy;
    fastcgi_temp_path     /var/lib/egress-proxy/fastcgi;
    uwsgi_temp_path       /var/lib/egress-proxy/uwsgi;
    scgi_temp_path        /var/lib/egress-proxy/scgi;

    map $host $egress_http_allowed {
        default 0;
        include /run/egress-proxy/allow-http.map;
    }

    log_format egress_http '$time_local host="$host" "$request" '
                           'allowed=$egress_http_allowed status=$status';
    access_log /var/log/egress-proxy/http.log egress_http;

    server {
        listen 127.0.0.1:3129;
        server_name _;

        location / {
            if ($egress_http_allowed = 0) {
                return 403 "claude-box: egress denied (host not in allowlist)\n";
            }
            # Re-resolve the Host header's hostname on the nginx side and relay.
            # A Host with a port (e.g. deb.debian.org:8080) won't match the map,
            # so it never reaches here.
            proxy_pass http://$host$request_uri;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_read_timeout 10m;
            proxy_buffering off;
        }
    }
}
